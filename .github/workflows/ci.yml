name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Skill contract and plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skills against the contract (C3)
        run: node scripts/validate-skills.mjs

      - name: Install the Claude Code CLI
        id: cli
        continue-on-error: true
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate the plugin manifest (strict)
        if: steps.cli.outcome == 'success'
        run: claude plugin validate . --strict

      - name: Report when the CLI could not be installed
        if: steps.cli.outcome != 'success'
        run: echo "::warning::@anthropic-ai/claude-code could not be installed; 'claude plugin validate --strict' was skipped"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run node:test suites (detector, hooks)
        run: |
          if ls test/*.test.mjs >/dev/null 2>&1; then
            node --test test/*.test.mjs
          else
            echo "no test/*.test.mjs yet"
          fi

      - name: Run validate-skills tests
        run: node scripts/test-validate-skills.mjs

      - name: Run legacy detect-sage-project tests (until the detector replaces them)
        run: |
          if [ -f scripts/test-detect-sage-project.mjs ]; then
            node scripts/test-detect-sage-project.mjs
          else
            echo "scripts/test-detect-sage-project.mjs removed; covered by test/*.test.mjs"
          fi

  sync-check:
    name: Verify derived files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify cursor-hooks.json is in sync with hooks.json
        run: node scripts/sync-cursor-hooks.mjs --check

      - name: Verify Codex/Cursor manifests are in sync with Claude
        run: node scripts/sync-codex-manifests.mjs --check

      - name: Verify generated Codex plugin (plugins/ + .agents/) is in sync
        run: node scripts/build-codex-plugin.mjs --check
